name: juhe-auth-debug
services:
  auth:
    build:
      context: ..
      dockerfile: local-auth/Dockerfile
      args:
        NODE_IMAGE: ${JUHE_NODE_IMAGE:-public.ecr.aws/docker/library/node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6}
    ports:
      - "127.0.0.1:47832:47831"
    volumes:
      - auth-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    init: true
    restart: unless-stopped
volumes:
  auth-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${JUHE_DOCKER_SUBNET:-10.254.220.0/24}
